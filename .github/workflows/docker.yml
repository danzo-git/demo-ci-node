name: CI/CD Docker Node.js

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: danzodocker 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/demo-ci-node:latest .

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/demo-ci-node:latest
      
      - name: Debug secrets
        run: echo "USER=${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: debian
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/deployer/app
            docker-compose pull
            docker-compose up -d
